kind = "web"
previewPath = "/"
title = "AI Medical Chatbot"
version = "1.0.0"
id = "artifacts/medical-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24185

[services.development]
run = "pnpm --filter @workspace/medical-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medical-ai", "run", "build" ]
publicDir = "artifacts/medical-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24185"
BASE_PATH = "/"
